version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cartpilot-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./cartpilot.db
      - DEMO_MODE=true
      - PORT=8000
    volumes:
      - ./backend/cartpilot.db:/app/cartpilot.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cartpilot-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
